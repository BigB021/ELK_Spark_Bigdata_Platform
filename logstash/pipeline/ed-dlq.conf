# =============================================================================
#  Pipeline ed-dlq : re-processes events that Elasticsearch refused in ed-visits
#  (HTTP 400/404, e.g. a field violating the strict mapping) so that no event
#  disappears silently. They are stored in ed-rejects-dlq with the ES error.
# =============================================================================
input {
  dead_letter_queue {
    id             => "in_dlq"
    path           => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id    => "ed-visits"
    commit_offsets => true
  }
}

filter {
  mutate {
    id        => "f_dlq_metadata"
    add_field => {
      "[dlq][reason]"      => "%{[@metadata][dead_letter_queue][reason]}"
      "[dlq][plugin_id]"   => "%{[@metadata][dead_letter_queue][plugin_id]}"
      "[dlq][plugin_type]" => "%{[@metadata][dead_letter_queue][plugin_type]}"
      "[dlq][entry_time]"  => "%{[@metadata][dead_letter_queue][entry_time]}"
    }
    replace   => {
      "[dq][status]"   => "rejected"
      "reject_reasons" => "es_indexing_error"
    }
  }
}

output {
  elasticsearch {
    id              => "out_es_dlq"
    hosts           => [ "http://es01:9200", "http://es02:9200" ]
    index           => "ed-rejects-dlq"
    data_stream     => false
    ilm_enabled     => false
    manage_template => false
  }
}
