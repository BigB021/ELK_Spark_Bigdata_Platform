# =============================================================================
#  Pipeline ed-visits : ED visits CSV  ->  quality control  ->  Elasticsearch
#
#  Parameters (environment variables):
#    INPUT_FILE       absolute path of the CSV to ingest
#    RUN_ID           "main" | "test"  -> index suffix (ed-visits-<RUN_ID>, ed-rejects-<RUN_ID>)
#    EXIT_AFTER_READ  "true" to stop Logstash once the file is read (batch / test mode)
#
#  Routing:
#    valid / warning records -> ed-visits-<RUN_ID>   (_id = SHA256(stay_id) => idempotent)
#    rejected records        -> ed-rejects-<RUN_ID>  + output/rejected-<RUN_ID>.ndjson
#    ES mapping failures     -> dead letter queue -> pipeline ed-dlq -> ed-rejects-dlq
#  Every plugin has an id: per-plugin counters at GET :9600/_node/stats/pipelines
# =============================================================================

input {
  file {
    id                      => "in_csv_file"
    path                    => "${INPUT_FILE}"
    mode                    => "read"                 # batch read of a finished file
    sincedb_path            => "/dev/null"            # re-read on every start (idempotent ids)
    file_completed_action   => "log"                  # never delete the source dataset
    file_completed_log_path => "/usr/share/logstash/output/completed-${RUN_ID}.log"
    exit_after_read         => "${EXIT_AFTER_READ:false}"
    codec                   => plain { charset => "UTF-8" }
  }
}

filter {
  # --- 0. Provenance --------------------------------------------------------
  mutate {
    id        => "f_provenance"
    copy      => { "message" => "[@metadata][raw_line]" }
    rename    => { "path" => "[ingest][source_file]" }
    add_field => {
      "[ingest][run_id]"   => "${RUN_ID:main}"
      "[ingest][pipeline]" => "ed-visits"
    }
  }

  # --- 1. Parsing (explicit columns; empty cells -> absent fields) ----------
  csv {
    id                 => "f_csv_parse"
    separator          => ","
    quote_char         => '"'
    skip_header        => true
    skip_empty_columns => true
    columns => [
      "record_id", "patient_id", "stay_id", "arrival_datetime", "departure_datetime",
      "length_of_stay_hours", "gender", "age_years", "race_ethnicity", "arrival_transport",
      "triage_acuity_esi", "chief_complaint", "temperature_f", "heart_rate_bpm",
      "resp_rate_bpm", "spo2_pct", "systolic_bp_mmhg", "diastolic_bp_mmhg",
      "pain_score_0_10", "primary_diagnosis_icd10", "primary_diagnosis_title",
      "medication_reconciliation_count", "disposition", "admitted_flag"
    ]
  }

  # --- 2. Snapshot of the original values (kept with rejected events) -------
  ruby {
    id   => "f_snapshot_original"
    code => '
      orig = {}
      event.to_hash.each { |k, v| orig[k] = v unless k.start_with?("@") || %w[message host ingest tags].include?(k) }
      event.set("[@metadata][original]", orig)
    '
  }

  # --- 3. Normalisation of strings ------------------------------------------
  mutate {
    id        => "f_normalize_case"
    uppercase => [ "gender", "race_ethnicity", "arrival_transport", "disposition", "primary_diagnosis_icd10" ]
    lowercase => [ "admitted_flag" ]
    strip     => [ "record_id", "patient_id", "stay_id", "gender", "race_ethnicity", "arrival_transport",
                   "chief_complaint", "primary_diagnosis_icd10", "primary_diagnosis_title",
                   "disposition", "admitted_flag" ]
  }

  # --- 4. Reference dictionaries (whitelists + synonyms) --------------------
  #     Unknown values -> "__INVALID__" ; the ruby rules turn them into UNKNOWN + issue
  translate {
    id => "f_dict_gender"
    source => "gender"  target => "[@metadata][norm][gender]"  fallback => "__INVALID__"
    dictionary => { "F" => "F"  "FEMALE" => "F"  "M" => "M"  "MALE" => "M"
                    "OTHER" => "OTHER"  "UNKNOWN" => "UNKNOWN" }
  }
  translate {
    id => "f_dict_race"
    source => "race_ethnicity"  target => "[@metadata][norm][race_ethnicity]"  fallback => "__INVALID__"
    dictionary => { "WHITE" => "WHITE"  "BLACK/AFRICAN AMERICAN" => "BLACK/AFRICAN AMERICAN"
                    "HISPANIC/LATINO" => "HISPANIC/LATINO"  "ASIAN" => "ASIAN"
                    "MULTIPLE RACE/ETHNICITY" => "MULTIPLE RACE/ETHNICITY"  "OTHER" => "OTHER"
                    "UNKNOWN" => "UNKNOWN"  "PATIENT DECLINED TO ANSWER" => "PATIENT DECLINED TO ANSWER" }
  }
  translate {
    id => "f_dict_transport"
    source => "arrival_transport"  target => "[@metadata][norm][arrival_transport]"  fallback => "__INVALID__"
    dictionary => { "WALK IN" => "WALK IN"  "WALK-IN" => "WALK IN"  "AMBULANCE" => "AMBULANCE"
                    "HELICOPTER" => "HELICOPTER"  "POLICE" => "POLICE"  "OTHER" => "OTHER"
                    "UNKNOWN" => "UNKNOWN" }
  }
  translate {
    id => "f_dict_disposition"
    source => "disposition"  target => "[@metadata][norm][disposition]"  fallback => "__INVALID__"
    dictionary => { "HOME" => "HOME"  "ADMITTED" => "ADMITTED"  "TRANSFER" => "TRANSFER"
                    "LEFT WITHOUT BEING SEEN" => "LEFT WITHOUT BEING SEEN"
                    "LEFT AGAINST MEDICAL ADVICE" => "LEFT AGAINST MEDICAL ADVICE"
                    "ELOPED" => "ELOPED"  "EXPIRED" => "EXPIRED"  "OTHER" => "OTHER" }
  }

  # --- 5. Dates: canonical format + documented legacy variant ---------------
  date {
    id             => "f_date_arrival"
    match          => [ "arrival_datetime", "yyyy-MM-dd HH:mm:ss", "dd/MM/yyyy HH:mm" ]
    target         => "arrival_datetime"
    timezone       => "UTC"
    tag_on_failure => [ "_arrival_date_invalid" ]
  }
  date {
    id             => "f_date_departure"
    match          => [ "departure_datetime", "yyyy-MM-dd HH:mm:ss", "dd/MM/yyyy HH:mm" ]
    target         => "departure_datetime"
    timezone       => "UTC"
    tag_on_failure => [ "_departure_date_invalid" ]
  }

  # --- 6. Quality rules: types, ranges, consistency, duplicates, routing ----
  ruby {
    id            => "f_quality_rules"
    path          => "/usr/share/logstash/scripts/ed_quality.rb"
    script_params => { "run_id" => "${RUN_ID:main}"  "max_los_hours" => 72  "los_tolerance_hours" => 0.1 }
  }

  # --- 7. Document ids (idempotent re-runs) ---------------------------------
  if [@metadata][route] == "valid" {
    fingerprint { id => "f_fp_stay_id"  source => [ "stay_id" ]  target => "[@metadata][doc_id]"  method => "SHA256" }
    # Unexpected fields never reach the strict mapping
    prune {
      id              => "f_prune_unexpected"
      whitelist_names => [ "^@timestamp$", "^record_id$", "^patient_id$", "^stay_id$", "^arrival_datetime$",
                           "^departure_datetime$", "^length_of_stay_hours$", "^gender$", "^age_years$",
                           "^race_ethnicity$", "^arrival_transport$", "^triage_acuity_esi$", "^chief_complaint$",
                           "^temperature_f$", "^heart_rate_bpm$", "^resp_rate_bpm$", "^spo2_pct$",
                           "^systolic_bp_mmhg$", "^diastolic_bp_mmhg$", "^pain_score_0_10$",
                           "^primary_diagnosis_icd10$", "^primary_diagnosis_title$",
                           "^medication_reconciliation_count$", "^disposition$", "^admitted_flag$",
                           "^icd10_chapter$", "^age_group$", "^arrival_hour$", "^arrival_dow$", "^arrival_month$",
                           "^los_computed_hours$", "^is_high_acuity$", "^fever_flag$", "^shock_index$",
                           "^dq$", "^ingest$" ]
    }
  } else {
    fingerprint { id => "f_fp_reject"  source => [ "[@metadata][reject_key]" ]  target => "[@metadata][doc_id]"  method => "SHA256" }
  }
}

output {
  if [@metadata][route] == "valid" {
    elasticsearch {
      id              => "out_es_valid"
      hosts           => [ "http://es01:9200", "http://es02:9200" ]
      index           => "ed-visits-${RUN_ID:main}"
      document_id     => "%{[@metadata][doc_id]}"
      action          => "index"
      data_stream     => false
      ilm_enabled     => false
      manage_template => false
    }
  } else {
    elasticsearch {
      id              => "out_es_rejected"
      hosts           => [ "http://es01:9200", "http://es02:9200" ]
      index           => "ed-rejects-${RUN_ID:main}"
      document_id     => "%{[@metadata][doc_id]}"
      action          => "index"
      data_stream     => false
      ilm_enabled     => false
      manage_template => false
    }
    file {
      id    => "out_file_rejected"
      path  => "/usr/share/logstash/output/rejected-${RUN_ID:main}.ndjson"
      codec => json_lines
    }
  }
}
